<meta charset='UTF-8'/>
<script type='module'>
    import parsePage from './parsePage.js';
    import focus from '../../utils/focus.js';

    const TESTS = [
        // -------------------------------------------------------------------------------------------------------------
        {
            name: 'basic',
            input: '',
            output: {
                header: '',
                sections: {},
                ids: {},
                footer: '',
            },
        },
        // -------------------------------------------------------------------------------------------------------------
        {
            name: 'just header',
            input: 'foo',
            output: {
                header: 'foo',
                sections: {},
                ids: {},
                footer: '',
            },
        },
        // -------------------------------------------------------------------------------------------------------------
        {
            name: 'header and footer',
            input: 'foo==',
            output: {
                header: 'foo',
                sections: {},
                ids: {},
                footer: '==',
            },
        },
        // -------------------------------------------------------------------------------------------------------------
        {
            name: 'header and footer 2',
            input: 'foo==bar',
            output: {
                header: 'foo',
                sections: {},
                ids: {},
                footer: '==bar',
            },
        },
        // -------------------------------------------------------------------------------------------------------------
        {
            name: 'header and footer 3',
            input: 'foo==\n\nbar',
            output: {
                header: 'foo',
                sections: {},
                ids: {},
                footer: 'bar',
            },
        },
        // -------------------------------------------------------------------------------------------------------------
        {
            name: 'header, section and footer',
            input: 'foo==hello==world==lorem==ipsum\n\nbar',
            output: {
                header: 'foo',
                sections: {
                    hello: 'world',
                    lorem: 'ipsum'
                },
                ids: {},
                footer: 'bar',
            },
        },
        // -------------------------------------------------------------------------------------------------------------
        {
            name: '+ids',
            input: 'header==section=={{|id=foo}}bar{{|id=hello}}world\n\nfooter',
            output: {
                header: 'header',
                sections: {
                    'section': '{{|id=foo}}bar{{|id=hello}}world'
                },
                ids: {
                    foo: 'bar',
                    hello: 'world'
                },
                footer: 'footer',
            },
        },
    ];

    await focus(parsePage, TESTS, {
        // sendInputAsArguments: true,
    });
</script>
